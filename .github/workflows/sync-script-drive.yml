name: Synchroniser la Bible vers Google Drive

on:
  push:
    branches: [main]
    paths:
      - Script_POLOP.md
      - scripts/sync_script_drive.py
      - .github/workflows/sync-script-drive.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: polop-script-drive
  cancel-in-progress: false

jobs:
  publier-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer la version canonique du script
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances Google et PDF
        run: python -m pip install --disable-pip-version-check "google-api-python-client>=2.0,<3" "google-auth>=2.0,<3" "reportlab>=4.0,<5"

      - name: Vérifier la configuration Drive
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          if [ -z "$GDRIVE_SA_KEY" ]; then
            echo "::error title=Configuration Drive manquante::Ajouter le secret GitHub GDRIVE_SA_KEY pour activer la synchronisation."
            exit 1
          fi
        shell: bash

      - name: Publier indépendamment le Google Docs et le PDF
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: python scripts/sync_script_drive.py
