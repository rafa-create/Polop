<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#e9edf0"/><g font-family="sans-serif" fill="#171717"><text x="60" y="85" font-size="42" font-weight="bold">PLANCHE 06 — LE MONDE INVERSÉ</text><g stroke="#171717" stroke-width="5" fill="none"><rect x="50" y="150" width="1100" height="400"/><rect x="50" y="580" width="530" height="430"/><rect x="620" y="580" width="530" height="430"/><rect x="50" y="1040" width="1100" height="480"/></g><g font-size="29"><text x="80" y="205">Thomas sort de la grotte. Il garde les écouteurs dans sa main.</text><text x="80" y="270">Une goutte remonte vers la roche.</text><text x="80" y="330">La poussière revient au sol.</text><text x="80" y="390">Il avance dans son temps inversé.</text><text x="80" y="620">Au loin, Éva et Léa parcourent leur propre trajectoire.</text><text x="80" y="680">Le relief les sépare.</text><text x="80" y="740">Elles ne voient jamais Thomas inversé.</text><text x="650" y="620">Thomas s'arrête.</text><text x="650" y="680">Il entend leurs voix déformées.</text><text x="650" y="740">Il comprend qu'elles sont là… mais hors de sa trajectoire.</text><text x="80" y="1100" font-size="38" font-weight="bold">La pierre remonte.</text><text x="80" y="1170">Elle retrouve progressivement la position qu'elle occupait avant sa chute.</text><text x="80" y="1260">Thomas l'observe passer au-dessus du creux.</text><text x="80" y="1380">Le même événement.</text><text x="80" y="1430">La même montagne.</text><text x="80" y="1480">L'autre sens du temps.</text></g></g></svg>