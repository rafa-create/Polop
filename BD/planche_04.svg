<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#f5f1e8"/><g font-family="sans-serif" fill="#171717"><text x="60" y="85" font-size="42" font-weight="bold">PLANCHE 04 — LA SÉPARATION</text><g stroke="#171717" stroke-width="5" fill="none"><rect x="50" y="150" width="1100" height="350"/><rect x="50" y="530" width="530" height="450"/><rect x="620" y="530" width="530" height="450"/><rect x="50" y="1010" width="1100" height="510"/></g><g font-size="29"><text x="80" y="205">17h50. Thomas prend le sentier secondaire.</text><text x="80" y="270">ÉVA : « Tu vas où ? »  THOMAS : « Je vais regarder un truc. Deux minutes. »</text><text x="80" y="410">Il disparaît derrière le relief.</text><text x="80" y="585">Thomas arrive au pont.</text><text x="80" y="640">Le cordage est détendu.</text><text x="80" y="695">Il remet le cordage en place et refait soigneusement le nœud.</text><text x="650" y="585">Éva et Léa continuent sur le chemin principal.</text><text x="650" y="650">Elles ne voient pas Thomas.</text><text x="650" y="730">Thomas non plus ne les voit pas.</text><text x="80" y="1080">Plus loin : une petite ouverture dans la roche.</text><text x="80" y="1140">Thomas entre dans la grotte.</text><text x="80" y="1260">Quelques minutes passent.</text><text x="80" y="1320">ÉVA : « Thomas ? »</text><text x="80" y="1380">Aucune réponse.</text><text x="80" y="1450">Éva et Léa décident de redescendre chercher de l'aide.</text></g></g></svg>