<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" viewBox="0 0 1200 1600" fill="#f5f1e8"/><g font-family="sans-serif" fill="#171717"><text x="60" y="85" font-size="42" font-weight="bold">PLANCHE 08 — LA FIN</text><g stroke="#171717" stroke-width="5" fill="none"><rect x="50" y="150" width="1100" height="350"/><rect x="50" y="530" width="530" height="430"/><rect x="620" y="530" width="530" height="430"/><rect x="50" y="990" width="1100" height="530"/></g><g font-size="30"><text x="80" y="205">17h00. Le monde retrouve son état normal.</text><text x="80" y="270">Léa arrive par le chemin sûr. Thomas regarde le pont.</text><text x="80" y="330">Il comprend enfin ce qu'il avait déjà vu sans le comprendre.</text><text x="80" y="590">ÉVA : « Ça va ? »</text><text x="80" y="650">THOMAS : « Oui. »</text><text x="650" y="590">LÉA : « Je peux repasser par là ? »</text><text x="650" y="650">THOMAS : « Ne traverse pas par là. Par là. »</text><text x="650" y="710">LÉA : « C'est plus long. »</text><text x="650" y="770">THOMAS : « Oui. »</text><text x="80" y="1050" font-size="38" font-weight="bold">Thomas touche sa poche.</text><text x="80" y="1120">La boîte est toujours là.</text><text x="80" y="1190">Il regarde Éva.</text><text x="80" y="1250">Puis Léa.</text><text x="80" y="1310">Puis le chemin.</text><text x="80" y="1400">Les larmes reviennent.</text><text x="80" y="1470" font-size="38" font-weight="bold">Cette fois, le lecteur sait pourquoi.</text></g></g></svg>