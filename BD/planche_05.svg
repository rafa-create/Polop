<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#eee8dc"/><g font-family="sans-serif" fill="#171717"><text x="60" y="85" font-size="42" font-weight="bold">PLANCHE 05 — 18h00</text><g stroke="#171717" stroke-width="5" fill="none"><rect x="50" y="150" width="530" height="430"/><rect x="620" y="150" width="530" height="430"/><rect x="50" y="620" width="1100" height="430"/><rect x="50" y="1090" width="1100" height="430"/></g><g font-size="30"><text x="80" y="205">Dans la grotte, Thomas découvre un anneau au sol.</text><text x="80" y="270">Il le prend. Hésite. Puis le met.</text><text x="650" y="205">Une goutte tombe.</text><text x="650" y="270">Puis… elle remonte.</text><text x="650" y="340">Thomas retire un écouteur.</text><text x="650" y="400">La musique semble revenir en arrière.</text><text x="80" y="680">Poussière. Petit caillou. Eau.</text><text x="80" y="750">Tout commence à fonctionner dans l'autre direction.</text><text x="80" y="840">Thomas regarde sa montre : 18h00.</text><text x="80" y="900">Il comprend progressivement que le problème n'est pas la musique.</text><text x="80" y="1130" font-size="38" font-weight="bold">C'est son temps personnel qui s'est inversé.</text><text x="80" y="1210">Il retire l'anneau. Rien.</text><text x="80" y="1270">Il le remet.</text><text x="80" y="1330">L'inversion continue.</text><text x="80" y="1450">SILENCE.</text></g></g></svg>