<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#f5f1e8"/><g font-family="sans-serif" fill="#171717"><text x="60" y="85" font-size="42" font-weight="bold">LA BOUCLE — PLANCHE 01</text><text x="60" y="125" font-size="22">LA RANDONNÉE / LE PONT</text><g stroke="#171717" stroke-width="5" fill="none"><rect x="50" y="170" width="1100" height="430"/><rect x="50" y="630" width="530" height="430"/><rect x="620" y="630" width="530" height="430"/><rect x="50" y="1090" width="1100" height="430"/></g><g stroke="#171717" stroke-width="3"><path d="M80 500 Q350 250 1080 450" fill="none"/><path d="M600 450 L850 560"/><path d="M610 445 L850 555"/><path d="M760 430 L760 570"/></g><g font-size="28"><text x="85" y="210">Fin d'après-midi. Thomas, Éva et Léa avancent sur la montagne.</text><text x="85" y="545">La caméra découvre le creux, le chemin sûr et le petit pont.</text><text x="75" y="675">Léa aperçoit le pont.</text><circle cx="270" cy="850" r="42"/><circle cx="390" cy="850" r="42"/><circle cx="510" cy="850" r="42"/><text x="75" y="1000">Elle traverse seule. Le nœud du cordage est déjà visible.</text><text x="75" y="1140">Personne ne remarque le détail.</text><text x="75" y="1200">La montagne semble parfaitement ordinaire.</text><text x="75" y="1330" font-size="38" font-weight="bold">Indice : le pont sera vu deux fois.</text><text x="75" y="1390">La seconde fois, le lecteur comprendra pourquoi.</text></g></g></svg>