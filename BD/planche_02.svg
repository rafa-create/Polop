<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#f5f1e8"/><g font-family="sans-serif" fill="#171717"><text x="60" y="85" font-size="42" font-weight="bold">PLANCHE 02 — 17h00</text><g stroke="#171717" stroke-width="5" fill="none"><rect x="50" y="150" width="1100" height="400"/><rect x="50" y="580" width="530" height="430"/><rect x="620" y="580" width="530" height="430"/><rect x="50" y="1040" width="1100" height="480"/></g><g font-size="30"><text x="80" y="205">Léa se dirige de nouveau vers le pont.</text><text x="80" y="490">THOMAS : « Ne traverse pas par là. »</text><text x="80" y="640">Thomas montre le chemin qui suit le creux.</text><path d="M90 900 Q250 720 500 880" stroke="#171717" stroke-width="6" fill="none"/><text x="80" y="970">LÉA : « C’est plus long. »</text><text x="650" y="640">THOMAS : « Oui. »</text><text x="650" y="950">Léa part par le chemin sûr.</text><text x="80" y="1110" font-size="38" font-weight="bold">Ce moment devient le point d’ancrage.</text><text x="80" y="1180">Plus tard, Thomas inversé retrouvera exactement</text><text x="80" y="1230">cette géographie en marche arrière.</text><text x="80" y="1360">La caméra mémorise le chemin.</text><text x="80" y="1410">Le spectateur, lui, ne sait pas encore pourquoi.</text></g></g></svg>